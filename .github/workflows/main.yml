name: Collaborative Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update_html_and_readme:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Update HTML
        if: github.actor == 'zhengyu10010715-netizen'
        run: |
          sed -i "/<\/body>/i <p>Updated by Team Leader on $(date -u '+%Y-%m-%d %H:%M:%S UTC')</p>" index.html
          cat index.html

      - name: Update README
        run: |
          echo "" >> README.md
          echo "### Updated by $GITHUB_ACTOR on $(date -u '+%Y-%m-%d %H:%M:%S UTC') [Commit: $(git rev-parse --short HEAD)]" >> README.md
          cat README.md

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Workflow: Updated HTML and README for $GITHUB_ACTOR"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Website
        run: |
          mkdir -p _site
          cp index.html _site/

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4
